<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration — DocBook</title>
    <meta name="description" content="Register your medical clinic and doctor profile on DocBook.">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                        linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
        }

        .auth-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 520px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.12);
            text-align: center;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <a href="index.html" class="auth-logo">
                <div class="brand-icon"><i class="ri-heart-pulse-fill"></i></div>
                <span>Doc<span style="color:var(--text-primary)">Book</span></span>
            </a>

            <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.3rem">Doctor / Specialist Registration</h2>
            <p style="color:var(--text-muted);font-size:0.92rem;margin-bottom:1.8rem">Join DocBook to accept appointments & build your medical schedule</p>

            <form id="doctorRegisterForm" onsubmit="handleDoctorRegister(event)">
                <div class="form-group">
                    <label class="form-label">Doctor Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g. Dr. Robert White" required>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Email Address *</label>
                        <input type="email" id="email" class="form-control" placeholder="dr.white@docbook.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Account Password *</label>
                        <input type="password" id="password" class="form-control" placeholder="Password" required minlength="4">
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Specialist Category *</label>
                        <select id="specialist" class="form-control" required>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="General Physician">General Physician</option>
                            <option value="Dermatologist">Dermatologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Orthopedic">Orthopedic Surgeon</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Experience (Yrs) *</label>
                        <input type="number" id="experience" class="form-control" placeholder="e.g. 10" min="1" max="60" required>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Hospital / Clinic Name</label>
                        <input type="text" id="hospital" class="form-control" placeholder="e.g. City Care Center" value="City Care Hospital">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Consultation Fee (₹)</label>
                        <input type="number" id="fee" class="form-control" placeholder="e.g. 700" value="700">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Profile Photo (Optional)</label>
                    <input type="file" id="photoFile" class="form-control" accept="image/*" style="padding:0.45rem">
                    <small style="color:var(--text-muted);font-size:0.75rem;display:block;margin-top:0.25rem">If empty, a default professional doctor avatar will be assigned.</small>
                </div>

                <div id="registerMsg" style="margin-bottom:1rem;font-size:0.88rem;font-weight:600;min-height:22px"></div>

                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-bottom:1.2rem">
                    <i class="ri-user-star-line"></i> Register as Doctor
                </button>
            </form>

            <p style="font-size:0.9rem;color:var(--text-secondary)">
                Already have a doctor profile? 
                <a href="login.html" style="font-weight:700">Sign In</a>
            </p>

            <div style="margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;font-size:0.85rem">
                <a href="user-register.html" style="color:var(--text-muted)">Register as Patient instead</a>
                <a href="index.html" style="color:var(--text-muted)">Back Home</a>
            </div>

        </div>
    </div>

    <!-- Storage Script -->
    <script src="docbook-storage.js"></script>

    <script>
        function handleDoctorRegister(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const specialist = document.getElementById("specialist").value;
            const experience = document.getElementById("experience").value;
            const hospital = document.getElementById("hospital").value.trim();
            const fee = document.getElementById("fee").value;
            const photoInput = document.getElementById("photoFile");
            const msg = document.getElementById("registerMsg");

            function submitDoc(photoUrl) {
                const res = DocBookDB.registerDoctor({
                    name,
                    email,
                    password,
                    specialist,
                    experience,
                    hospital: hospital || "DocBook Affiliated Hospital",
                    fee: Number(fee) || 700,
                    photo: photoUrl || "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=300&q=80"
                });

                if (res.success) {
                    msg.style.color = "var(--status-confirmed)";
                    msg.textContent = "✔ Doctor Profile created! Logging you in...";

                    // Auto-login
                    DocBookDB.login(email, password);

                    setTimeout(() => {
                        window.location.href = "doctor-dashboard.html";
                    }, 1000);
                } else {
                    msg.style.color = "var(--status-cancelled)";
                    msg.textContent = res.message;
                }
            }

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    submitDoc(evt.target.result);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                submitDoc(null);
            }
        }
    </script>
</body>
</html>
